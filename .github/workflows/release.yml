name: Publicar Release do Xolas Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm install

      - name: Compilar Aplicativo Desktop
        env:
          VITE_API_URL: https://xolas-server.onrender.com
        run: |
          npm --prefix client run build
          npx electron-builder --projectDir client --win --publish never

      - name: Publicar Release Oficial no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client/release/*.exe
            client/release/*.blockmap
            client/release/latest.yml
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
